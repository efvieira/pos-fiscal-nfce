services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pos
      # Para usar um certificado A1 real (homologação), monte o arquivo e defina:
      # FISCAL_CERT_PATH: /run/secrets/certificado.pfx
      # FISCAL_CERT_PASSWORD: ${FISCAL_CERT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
